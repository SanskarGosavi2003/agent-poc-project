<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malad Vice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1a0b2e;overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:#fff;user-select:none}
canvas#c{display:block;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;text-shadow:2px 2px 0 #000}
#tr{top:14px;right:18px;text-align:right}
#money{font-weight:800;font-size:30px;color:#59f0a0;letter-spacing:1px}
#stars{font-size:26px;letter-spacing:2px;color:rgba(255,255,255,.25)} #stars b{color:#ffd23f}
.bar{width:170px;height:10px;background:rgba(0,0,0,.55);margin:5px 0 0 auto;border:2px solid #000}.bar i{display:block;height:100%}
#hp i{background:#ff5fa2}#vhp i{background:#39d5ff}
#job{top:16px;left:50%;transform:translateX(-50%);background:rgba(20,5,40,.7);padding:8px 16px;border-radius:6px;font-size:16px;color:#ffd23f;border:1px solid #ff5fa2;white-space:nowrap}
#warn{top:62px;left:50%;transform:translateX(-50%);font-weight:800;color:#ff5a5a}
#near{left:18px;bottom:212px;font-size:14px;color:#ffd0e6}
#radar{left:16px;bottom:16px;width:184px;height:184px;border-radius:50%;border:3px solid #ff5fa2;box-shadow:0 0 14px #ff5fa2;overflow:hidden;background:#1a0b2e}
#help{right:16px;bottom:12px;font-size:12px;opacity:.7}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:2px solid #fff;opacity:.7}
#big{inset:0;display:none;align-items:center;justify-content:center;font-family:Pacifico,cursive;font-size:96px;background:rgba(0,0,0,.4);text-shadow:4px 4px 0 #000}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:linear-gradient(#1a0b3a 0%,#7b2a8a 45%,#ff5fa2 75%,#ffb26b 100%)}
#ov>div{max-width:600px;padding:24px}
h1{margin:0;font-family:Pacifico,cursive;font-weight:400;font-size:84px;color:#ff5fa2;text-shadow:3px 3px 0 #2de2e6,6px 6px 0 #1a0b2e;transform:rotate(-4deg)}
h2{margin:0 0 18px;letter-spacing:10px;font-size:18px;color:#2de2e6}
p{margin:8px 0;line-height:1.5} kbd{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:1px 6px;font-size:13px}
#mode{font-size:13px;opacity:.85;margin-top:14px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div class="hud" id="tr"><div id="money">₹0</div><div id="stars"></div><div class="bar" id="hp"><i></i></div><div class="bar" id="vhp"><i></i></div></div>
<div class="hud" id="job"></div><div class="hud" id="warn"></div><div class="hud" id="near"></div>
<canvas class="hud" id="radar" width="184" height="184"></canvas>
<div class="hud" id="help"></div><div class="hud" id="cross"></div><div class="hud" id="big"></div>
<div id="ov"><div>
<h1>Malad Vice</h1><h2>MUMBAI · 400064</h2>
<p><kbd>WASD</kbd> move / drive &nbsp; <kbd>Mouse</kbd> look &nbsp; <kbd>E</kbd> enter / exit vehicle &nbsp; <kbd>Click</kbd> or <kbd>F</kbd> shoot &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Space</kbd> handbrake &nbsp; <kbd>H</kbd> horn</p>
<p>Run deliveries for ₹. Hurt people and the cops come. Keep off the tracks when the local comes through.</p>
<p id="mode">building the city…</p>
<p><b id="go" style="display:none">Click to start</b></p>
</div></div>
<script type="module" src="./game.js"></script>
</body></html>
